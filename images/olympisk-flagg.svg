<svg xmlns="http://www.w3.org/2000/svg" width="820" height="530" viewBox="0 0 820 530" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="530" rx="10" fill="#fbfaf7" stroke="#ddd8cf"/>

  <text x="44" y="40" font-size="17" font-weight="700" fill="#2b2b2b">olympisk-flagg.arr: slik settes de fem ringene sammen</text>
  <text x="44" y="60" font-size="13" fill="#6b6b6b">overlay-xy(bilde1, dx, dy, bilde2) forskyver bilde2 dx piksler til høyre og dy piksler ned</text>

  <g>
    <circle cx="57" cy="106" r="13" fill="#2b2b2b"/>
    <text x="57" y="111" font-size="13" font-weight="700" fill="#fbfaf7" text-anchor="middle">1</text>
    <text x="82" y="103" font-size="14" font-weight="700" fill="#2b2b2b">ring1_2</text>
    <text x="82" y="125" font-size="13.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#3f5b8b">overlay-xy(ring1, 30, 30, ring2)</text>
    <text x="82" y="146" font-size="12.5" fill="#6b6b6b">blå ring, gul ring lagt ned til høyre for den</text>
    <g>
      <circle cx="569" cy="112" r="24" fill="none" stroke="blue" stroke-width="3"/>
      <circle cx="593" cy="136" r="24" fill="none" stroke="#e8c000" stroke-width="3"/>
    </g>
  </g>
  <line x1="44" y1="176" x2="776" y2="176" stroke="#e6e1d8"/>

  <g>
    <circle cx="57" cy="216" r="13" fill="#2b2b2b"/>
    <text x="57" y="221" font-size="13" font-weight="700" fill="#fbfaf7" text-anchor="middle">2</text>
    <text x="82" y="213" font-size="14" font-weight="700" fill="#2b2b2b">ring3_4</text>
    <text x="82" y="235" font-size="13.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#3f5b8b">overlay-xy(ring3, 30, 30, ring4)</text>
    <text x="82" y="256" font-size="12.5" fill="#6b6b6b">samme mønster med sort og grønn</text>
    <g>
      <circle cx="569" cy="222" r="24" fill="none" stroke="black" stroke-width="3"/>
      <circle cx="593" cy="246" r="24" fill="none" stroke="green" stroke-width="3"/>
    </g>
  </g>
  <line x1="44" y1="286" x2="776" y2="286" stroke="#e6e1d8"/>

  <g>
    <circle cx="57" cy="326" r="13" fill="#2b2b2b"/>
    <text x="57" y="331" font-size="13" font-weight="700" fill="#fbfaf7" text-anchor="middle">3</text>
    <text x="82" y="323" font-size="14" font-weight="700" fill="#2b2b2b">ring1_2_3_4</text>
    <text x="82" y="345" font-size="13.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#3f5b8b">overlay-xy(ring1_2, 70, 0, ring3_4)</text>
    <text x="82" y="366" font-size="12.5" fill="#6b6b6b">paret flyttes 70 piksler til høyre, ikke ned</text>
    <g>
      <circle cx="513" cy="332" r="24" fill="none" stroke="blue" stroke-width="3"/>
      <circle cx="537" cy="356" r="24" fill="none" stroke="#e8c000" stroke-width="3"/>
      <circle cx="569" cy="332" r="24" fill="none" stroke="black" stroke-width="3"/>
      <circle cx="593" cy="356" r="24" fill="none" stroke="green" stroke-width="3"/>
    </g>
  </g>
  <line x1="44" y1="396" x2="776" y2="396" stroke="#e6e1d8"/>

  <g>
    <circle cx="57" cy="436" r="13" fill="#2b2b2b"/>
    <text x="57" y="441" font-size="13" font-weight="700" fill="#fbfaf7" text-anchor="middle">4</text>
    <text x="82" y="433" font-size="14" font-weight="700" fill="#2b2b2b">ring1_2_3_4_5</text>
    <text x="82" y="455" font-size="13.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#3f5b8b">overlay-xy(ring1_2_3_4, 140, 0, ring5)</text>
    <text x="82" y="476" font-size="12.5" fill="#6b6b6b">den røde ringen lukker den øverste raden</text>
    <g>
      <circle cx="485" cy="442" r="24" fill="none" stroke="blue" stroke-width="3"/>
      <circle cx="509" cy="466" r="24" fill="none" stroke="#e8c000" stroke-width="3"/>
      <circle cx="541" cy="442" r="24" fill="none" stroke="black" stroke-width="3"/>
      <circle cx="565" cy="466" r="24" fill="none" stroke="green" stroke-width="3"/>
      <circle cx="597" cy="442" r="24" fill="none" stroke="red" stroke-width="3"/>
    </g>
  </g>
</svg>
